name: Feature request
description: Suggest a change or an idea for the game.
title: "[Cartoon Wars Gunner] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help
      description: What problem does it solve, or what would it make better?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - Both
